name: newh
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: newh
      POSTGRES_USER: newh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U newh -d newh"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    image: newh:local
    restart: unless-stopped
    init: true
    networks:
      - default
      - upscale
    volumes:
      - uploads:/app/uploads
      - rf39_snapshots:/app/rf39
      - ./.data/nmarket:/app/nmarket
    ports:
      - "${PORT:-3100}:3000"
    environment:
      DATABASE_URL: postgresql://newh:${POSTGRES_PASSWORD}@db:5432/newh?schema=app
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      UPSCALE_ENABLED: "true"
      NUXT_MAP_SEARCH_URL: ${NUXT_MAP_SEARCH_URL:-https://nominatim.openstreetmap.org/search}
      NUXT_RF39_TOKEN: ${NUXT_RF39_TOKEN:-}
      NUXT_RF39_SNAPSHOT_PATH: /app/rf39/snapshot.json
      NUXT_NMARKET_FEED_URL: ${NUXT_NMARKET_FEED_URL:-}
      NUXT_NMARKET_SNAPSHOT_PATH: /app/nmarket/snapshot.xml
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost:3100}
      NUXT_PUBLIC_SITE_NAME: Квартирукупить
      NUXT_PUBLIC_PHONE: ${NUXT_PUBLIC_PHONE:-}
      NUXT_PUBLIC_LEGAL_NAME: ${NUXT_PUBLIC_LEGAL_NAME:-}
      NUXT_PUBLIC_LEGAL_ADDRESS: ${NUXT_PUBLIC_LEGAL_ADDRESS:-}
      NUXT_PUBLIC_LEGAL_EMAIL: ${NUXT_PUBLIC_LEGAL_EMAIL:-}
      NUXT_PUBLIC_INN: ${NUXT_PUBLIC_INN:-}
    depends_on:
      db:
        condition: service_healthy
      upscale:
        condition: service_healthy
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 3

  upscale:
    build: ./services/upscale
    image: newh-upscale:local
    restart: unless-stopped
    init: true
    networks:
      - upscale
    cpus: 2
    mem_limit: 4g
    memswap_limit: 4g
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  uploads:
  rf39_snapshots:

networks:
  upscale:
    internal: true
